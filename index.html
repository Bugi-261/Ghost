/* ================= THEME (single source for colour, type, spacing) ================= */
:root{
  --bg:#0B0B0C; --surface:#161718; --surface2:#202123; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --paper:#1C1C1E; --white:#29292C; --ink:#F2F2EE; --ink2:#9C9E99; --ink3:#66686A; --on:#FFFFFF; --acct:#F2566C;
  --lime:#C81E3A; --lime2:#8E1226; --lime-deep:#F2566C; --olive:#1A0A0D;
  --text:#F2F2EE; --text2:#9C9E99; --text3:#5F615D; --danger:#F2F2EE;
  --r-xl:32px; --r-lg:26px; --r-md:18px; --r-sm:14px; --pill:999px;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --font:"Outfit","Avenir Next","Avenir","Century Gothic",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;font-weight:300;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}
#view{display:flex;flex-direction:column;height:100%}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .14s var(--ease),filter .14s}
.press:active{transform:scale(.96)}

/* ---- light top panel ---- */
.hero{border-bottom:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0 0 var(--r-xl) var(--r-xl);padding:calc(env(safe-area-inset-top) + 10px) var(--s4) var(--s4);flex:none;position:relative;z-index:2}
.hero.in{animation:drop .45s var(--ease) both}
.tb{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:var(--pill);padding:7px 8px;min-height:52px}
.tb h1{flex:1;margin:0;text-align:center;font-size:19px;font-weight:400;letter-spacing:.01em}
.mark{width:38px;height:38px;display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.cbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s,transform .14s var(--ease)}
.cbtn:active{transform:scale(.88);background:rgba(255,255,255,.1)}
.hero .seg{margin-top:12px}

/* ---- dark sub-page bar ---- */
.bar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) var(--s4) 10px;flex:none}
.bar h1{flex:1;margin:0;font-size:20px;font-weight:400}
.bar .cbtn{background:var(--surface);border:1px solid var(--line)}
.bar .cbtn:active{background:var(--surface2)}
.pillbtn{padding:9px 16px;border-radius:var(--pill);background:var(--lime);color:var(--on);font-weight:500;font-size:14px}

/* ---- content ---- */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4) var(--s4) 120px}
.sub .content{padding-bottom:40px}
.stack>*+*{margin-top:10px}
h2{margin:var(--s5) 0 var(--s3);font-size:22px;font-weight:300;letter-spacing:.01em}
h2:first-child{margin-top:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between}
.lnk{color:var(--text2);font-size:14px;padding:6px 2px}
.label{font-size:13px;color:var(--text3);margin:var(--s5) 4px var(--s2);letter-spacing:.02em}
.label:first-child{margin-top:4px}
.in-tab>*,.in-push>*,.in-pop>*{animation:rise .42s var(--ease) both}
.in-push>*{animation-name:slideL}.in-pop>*{animation-name:slideR}
.content>*:nth-child(2){animation-delay:.04s}.content>*:nth-child(3){animation-delay:.08s}.content>*:nth-child(4){animation-delay:.12s}
.content>*:nth-child(5){animation-delay:.16s}.content>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}}
@keyframes drop{from{opacity:.4;transform:translateY(-12px)}}

/* ---- week strip ---- */
.wk{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px;font-size:14px;color:var(--ink2)}
.wk .cbtn{width:30px;height:30px}.wk .cbtn[disabled]{opacity:.25;pointer-events:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 8px;border-radius:var(--r-md);color:var(--ink3);transition:background .2s,color .2s,transform .2s var(--spring)}
.day b{font-size:22px;font-weight:300;line-height:1.1}
.day span{font-size:11px}
.day i{display:flex;gap:3px;height:5px;margin-top:4px}
.day i u{width:5px;height:5px;border-radius:50%;background:var(--lime-deep)}
.day.has{color:var(--ink)}
.day.today b{font-weight:500}
.day.on{background:var(--ink);color:var(--white);transform:translateY(-2px)}
.day.on i u{background:var(--lime)}
.day:active{transform:scale(.92)}

/* ---- hero stat card ---- */
.statc{display:flex;gap:14px;background:var(--white);border-radius:var(--r-lg);padding:16px 18px;margin-top:12px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.cap{font-size:13px;color:var(--ink2)}
.big{font-size:40px;font-weight:300;line-height:1.1;margin-top:2px;white-space:nowrap}
.big small{font-size:15px;color:var(--ink2);margin-left:5px}
.delta{font-size:12px;color:var(--lime-deep);font-weight:500;margin-left:6px}
.delta.neg{color:var(--ink2)}
.spark{display:block;width:100%;max-width:170px;height:46px;margin-top:6px;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dsum{width:42%;flex:none;background:var(--paper);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.dsum.swap{animation:pop .3s var(--ease)}
.dn{font-size:21px;font-weight:400;line-height:1.15;margin:4px 0;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{opacity:0;transform:scale(.94)}}

/* ---- glow cards ---- */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--s4) * -1);padding:2px var(--s4) 6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.glow{position:relative;flex:none;width:158px;height:206px;border-radius:var(--r-lg);background:var(--olive);border:1px solid rgba(200,30,58,.16);overflow:hidden;scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;isolation:isolate}
.glow .gt{font-size:17px;font-weight:400;line-height:1.2;padding-right:34px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.glow .gs{font-size:12px;color:rgba(242,242,238,.6);margin-top:4px}
.glow .go{position:absolute;top:12px;right:12px}
.go{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--text);flex:none;background:rgba(255,255,255,.04)}
.go svg{width:14px;height:14px}
.blob{position:absolute;z-index:-1;left:-4%;bottom:-46%;width:108%;aspect-ratio:1;filter:blur(16px);
  background:radial-gradient(circle at 50% 45%,#FF6B7D 0,#E0314D 20%,var(--lime) 38%,#5A0B18 62%,transparent 74%);
  border-radius:58% 42% 55% 45%/52% 60% 40% 48%;animation:morph 9s ease-in-out infinite alternate}
.b1{border-radius:40% 60% 38% 62%/62% 40% 60% 38%;animation-duration:11s;animation-delay:-3s}
.b2{border-radius:65% 35% 48% 52%/38% 55% 45% 62%;animation-duration:13s;animation-delay:-6s}
@keyframes morph{0%{transform:rotate(0) scale(1)}50%{transform:rotate(24deg) scale(1.08) translateY(-5%);border-radius:44% 56% 62% 38%/46% 42% 58% 54%}100%{transform:rotate(-18deg) scale(.96)}}
.glow.add{background:transparent;border:1px dashed var(--line2);justify-content:center;align-items:center;color:var(--text2);text-align:center;font-size:14px}
.glow.add .go{position:static;margin:0 auto 10px;width:40px;height:40px}

/* ---- soft cards ---- */
.soft{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.h3{font-size:18px;font-weight:400;line-height:1.2}
.s{color:var(--text2);font-size:13px;margin-top:3px}
.dim{color:var(--text3)}
.rowc{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .chv{color:var(--text3);transition:transform .25s var(--ease)}
.rec.open .chv{transform:rotate(90deg)}
.rec .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.rec.open .more{grid-template-rows:1fr}
.rec .more>div{overflow:hidden}
.ln{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--text2);padding:7px 0;border-top:1px solid var(--line)}
.ln:first-child{margin-top:12px}
.ln b{font-weight:400;color:var(--text);white-space:nowrap}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;font-size:16px;font-weight:400;border-radius:var(--pill);border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .14s var(--ease),filter .14s}
.btn:active{transform:scale(.97);filter:brightness(1.12)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--on);font-weight:500;box-shadow:0 8px 28px rgba(200,30,58,.3)}
.btn.danger{color:var(--text);border-color:var(--line2);background:transparent}
.btn.danger::before{content:"!";display:grid;place-items:center;width:18px;height:18px;border:1px solid currentColor;border-radius:50%;font-size:12px;font-weight:500;flex:none}
.btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
.btn.sm{width:auto;flex:none;white-space:nowrap;font-size:15px}

/* ---- segmented + chips ---- */
.seg{display:flex;border-radius:var(--pill);background:rgba(255,255,255,.07);padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;text-align:center;font-size:15px;color:var(--ink2);border-radius:var(--pill);transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:var(--white)}
.content .seg,.panel .seg{background:var(--surface);border:1px solid var(--line)}
.content .seg button,.panel .seg button{color:var(--text2)}
.content .seg button.on,.panel .seg button.on{background:var(--lime);color:var(--on);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--s4) * -1);padding:0 var(--s4)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;font-size:14px;border:1px solid var(--line2);color:var(--text2);border-radius:var(--pill);white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .14s var(--ease)}
.chip:active{transform:scale(.93)}
.chip.on{border-color:var(--lime);color:var(--on);background:var(--lime);font-weight:400}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border:1px solid var(--line2);color:var(--text2);border-radius:var(--pill);margin-left:8px;vertical-align:2px}
.tag.y{border-color:rgba(200,30,58,.4);color:var(--acct)}

/* ---- forms ---- */
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--text3);margin:0 4px 6px}
.inp{width:100%;height:48px;padding:0 16px;background:#0F1011;border:1px solid var(--line);border-radius:var(--r-sm);font-size:16px;font-weight:300;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(200,30,58,.1)}
.inp::placeholder{color:var(--text3)}
.inp[disabled]{opacity:.6}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.inp.name{font-size:24px;height:58px;border-radius:var(--r-md)}
.inp.n{width:44px;flex:none;height:40px;padding:0;text-align:center;font-size:18px;font-weight:400;border-radius:12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--pill);background:#0F1011;height:40px;flex:none}
.step button{width:32px;height:38px;text-align:center;color:var(--text2);font-size:20px;line-height:1;transition:color .15s,transform .14s var(--spring)}
.step button:active{color:var(--acct);transform:scale(1.35)}
.step b{min-width:26px;text-align:center;font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.bump{animation:bump .3s var(--spring)}
@keyframes bump{from{transform:scale(1.5);color:var(--acct)}}
.mini{font-size:12px;color:var(--text3)}
.tog{width:52px;height:32px;border-radius:var(--pill);background:var(--surface2);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--text2);transition:transform .25s var(--spring),background .2s}
.tog.on{background:var(--lime)}.tog.on::after{transform:translateX(20px);background:var(--on)}

/* ---- routine rows ---- */
.rt{padding-left:6px}
.item{padding:14px 14px 14px 4px;align-items:flex-start}
.drag{position:relative;z-index:5;border-color:var(--lime)!important;box-shadow:0 14px 40px rgba(0,0,0,.6);background:var(--surface2)}
.handle{width:34px;align-self:stretch;display:grid;place-items:center;color:var(--text3);touch-action:none;flex:none;cursor:grab;min-height:44px}
.ctl{display:flex;align-items:center;gap:6px;margin-top:12px;white-space:nowrap}
.note{height:40px;font-size:14px;margin-top:10px}
.x{width:32px;height:32px;display:grid;place-items:center;color:var(--text3);flex:none;border-radius:50%;transition:.15s}
.x:active{color:var(--text);background:rgba(255,255,255,.12);transform:scale(.88)}
.x svg{width:16px;height:16px}

/* ---- exercise list ---- */
.ex{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:58px;transition:padding .2s var(--ease)}
.ex:active{padding-left:10px}
.ex .nm{font-size:16px;font-weight:400;transition:color .2s}
.box{width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;flex:none;display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.box svg{width:15px;height:15px;stroke-width:2}
.ex.sel .box{background:var(--lime);border-color:var(--lime);color:var(--on);animation:bump .3s var(--spring)}
.ex.sel .nm{color:var(--acct)}
.ex .chv{color:var(--text3)}
.grp{font-size:13px;color:var(--acct);padding:20px 4px 6px}
.empty{text-align:center;color:var(--text3);padding:44px 24px;font-size:14px;line-height:1.55}
.empty b{display:block;font-size:22px;font-weight:300;color:var(--text2);margin-bottom:8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0;padding-bottom:2px}.setrow:first-child{padding-top:2px}

/* ---- floating nav ---- */
#nav{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:20;display:flex;width:min(320px,calc(100% - 48px));padding:6px;border-radius:var(--pill);
  background:rgba(32,33,35,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .35s var(--ease),opacity .25s}
.sub #nav{transform:translate(-50%,120px);opacity:0;pointer-events:none}
#nav button{flex:1;height:46px;display:grid;place-items:center;color:var(--text2);position:relative;z-index:1;transition:color .25s,transform .14s var(--ease)}
#nav button:active{transform:scale(.85)}
#nav button.on{color:var(--on)}
#nav .ind{position:absolute;top:6px;left:6px;width:calc((100% - 12px)/5);height:46px;border-radius:var(--pill);background:var(--lime);transition:transform .4s var(--spring);box-shadow:0 0 22px rgba(200,30,58,.35)}

/* ---- sheet ---- */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.back{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92dvh;display:flex;flex-direction:column;background:#131415;border:1px solid var(--line2);border-bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;animation:up .38s var(--ease) both}
.panel.full{height:92dvh}
.panel.noanim{animation:none}
@keyframes up{from{transform:translateY(100%)}}
.phead{display:flex;align-items:center;gap:12px;padding:22px 20px 12px;position:relative;touch-action:none}
.phead::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line2)}
.phead h2{flex:1;margin:0;font-size:22px}
.phead .cbtn{background:var(--surface2)}
.pbody{flex:1;overflow-y:auto;padding:var(--s4) 20px;-webkit-overflow-scrolling:touch}
.pfoot{padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px}
#toast{border:1px solid var(--line2);position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,16px) scale(.9);z-index:60;background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:var(--pill);font-size:14px;font-weight:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--spring);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
/* ---- active workout ---- */
body{touch-action:manipulation}
#wo{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#wo.open{display:flex;animation:up .36s var(--ease) both}
#wo>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.wbar h1{font-size:19px}
.wbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 40px}
#restbar{padding:0 16px;flex:none}
.rest{position:relative;margin-bottom:8px;height:48px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line2);overflow:hidden;display:flex;align-items:center;gap:4px;padding:0 6px 0 18px;animation:rise .3s var(--ease)}
.rest .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(200,30,58,.12),rgba(200,30,58,.34));transition:width .5s linear}
.rest>*:not(.fill){position:relative}
.rest b{font-size:21px;font-weight:400;flex:1;margin-left:8px}
.rest button{height:36px;padding:0 11px;border-radius:var(--pill);color:var(--text2);font-size:13px}
.rest button:active{background:var(--surface2)}
.rest .skip{background:var(--lime);color:var(--on);font-weight:500;padding:0 16px}
.wcard{padding:14px 12px}
.whead{display:flex;gap:8px;align-items:flex-start;padding:0 4px}
.tgt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--acct);margin-top:4px;max-width:100%}
.tgt svg{width:14px;height:14px}
.tgt.off{color:var(--text3)}
.thead,.srow{display:grid;grid-template-columns:36px 1fr 70px 56px 40px;gap:6px;align-items:center}
.thead{font-size:11px;color:var(--text3);margin:14px 0 4px;text-align:center}
.srow{padding:4px 2px;border-radius:14px;transition:background .3s}
.srow.done{background:rgba(200,30,58,.1)}
.st{height:38px;border-radius:10px;text-align:center;font-weight:500;font-size:15px;color:var(--text2)}
.st:active{background:var(--surface2)}
.t-warmup{color:#8FB4D9}.t-backoff{color:#B9A3F0}.t-drop{color:#F0A36B}.t-myo{color:#6FD3C1}.t-failure{color:#FF9F6B}
.pv{text-align:center;font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.pr{color:var(--acct);font-weight:400}
.fld{height:40px;border-radius:12px;background:#0F1011;border:1px solid var(--line);text-align:center;font-size:17px;font-weight:400;transition:border-color .15s,box-shadow .15s}
.fld i{font-style:normal;color:var(--text3)}
.fld.on{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,30,58,.16)}
.srow.done .fld:not(.on){background:transparent;border-color:transparent}
.chk{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--text3);justify-self:center;flex:none;transition:background .2s,border-color .2s,color .2s,transform .14s var(--ease)}
.chk svg{width:17px;height:17px;stroke-width:2}
.chk:active{transform:scale(.85)}
.done>.chk,.done .cfoot .chk{background:var(--lime);border-color:var(--lime);color:var(--on);box-shadow:0 0 18px rgba(200,30,58,.3)}
.addset{display:block;width:100%;text-align:center;padding:12px 0 2px;font-size:14px;color:var(--text2)}
.addset:active{color:var(--acct)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{height:auto;padding:10px 14px 9px;text-align:left;border-radius:16px}
.tile span{display:block;font-size:12px;color:var(--text3);font-weight:300}
.tile b{display:block;font-size:26px;font-weight:300;line-height:1.2}
.cent.done .tile:not(.on){background:rgba(200,30,58,.08);border-color:transparent}
.cfoot{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 2px}
.swb{height:40px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line2);font-size:14px;white-space:nowrap;flex:none}
.swb.run{background:var(--lime);color:var(--on);border-color:var(--lime);font-weight:500}
.der{flex:1;font-size:13px;color:var(--text2);min-width:0;line-height:1.35}
.kp{flex:none;background:#131415;border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
.kp.kin{animation:up .26s var(--ease)}
.kp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 8px}
.kcopy{font-size:13px;color:var(--acct);padding:7px 12px;border:1px solid rgba(200,30,58,.3);border-radius:var(--pill);white-space:nowrap;flex:none}
.kcopy:active{background:rgba(200,30,58,.12)}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:6px}
.key{height:50px;border-radius:14px;background:var(--surface2);font-size:23px;text-align:center;font-weight:300;display:grid;place-items:center;transition:transform .08s}
.key:active{background:#303134;transform:scale(.94)}
.key.fn{font-size:15px;color:var(--text2);background:var(--surface)}
.key.next{background:var(--lime);color:var(--on);font-weight:500;font-size:16px}
#mini{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:19;display:none}
#mini.on{display:block;animation:rise .3s var(--ease)}
.sub #mini{bottom:calc(env(safe-area-inset-bottom) + 16px)}
#mini button{display:flex;gap:10px;align-items:center;padding:11px 18px;border-radius:var(--pill);background:var(--lime);color:var(--on);font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.55);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--on);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.content{padding-bottom:170px}
.go.play{background:var(--lime);border-color:var(--lime);color:var(--on);width:40px;height:40px;transition:transform .14s var(--ease)}
.go.play:active{transform:scale(.86)}
.go.play svg{fill:currentColor;stroke:none;width:15px;height:15px;margin-left:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl{padding:14px 12px;border-radius:20px}
.tl b{display:block;font-size:25px;font-weight:300;line-height:1.15}
.tl span{font-size:12px;color:var(--text3)}
.cmp .ln:first-child{margin-top:0;border-top:0;padding-top:2px}
.cmp .ln:last-child{padding-bottom:2px}
.ln em{font-style:normal;color:var(--text3);font-size:12px;margin-left:6px}
.ln em.up{color:var(--acct)}
.inp{color-scheme:dark}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh .cbtn{background:var(--surface2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;justify-items:center}
.cal .wd{font-size:11px;color:var(--text3);padding:4px 0}
.cd{width:100%;max-width:42px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--text3);position:relative;text-align:center;transition:background .2s,color .2s,transform .14s var(--ease)}
.cd:active{transform:scale(.88)}
.cd.has{background:rgba(200,30,58,.16);color:var(--acct)}
.cd.today{box-shadow:inset 0 0 0 1px var(--line2);color:var(--text)}
.cd.today.has{color:var(--acct)}
.cd.on{background:var(--lime);color:var(--on);font-weight:500}
.cd u{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:8px;font-size:10px;line-height:15px;text-decoration:none;background:var(--text);color:var(--bg);font-weight:500}
.hrow{display:grid;grid-template-columns:34px 1fr 58px 62px;gap:8px;align-items:center;padding:6px 0;font-size:15px;border-top:1px solid var(--line)}
.hrow.hh{font-size:11px;color:var(--text3);margin-top:12px;border:0;padding-bottom:4px}
.hrow>span:nth-child(n+3){text-align:right;color:var(--text2);font-size:14px}
.hrow.hh>span:nth-child(n+3){font-size:11px;color:var(--text3)}
.hrow b{font-weight:400;white-space:nowrap}
.hrow .st{display:block;height:auto;text-align:center;font-size:14px}
.hrow.hh>span:first-child{text-align:center}
.cst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cst span{display:block;font-size:11px;color:var(--text3)}
.cst b{font-weight:400;font-size:16px}
.ln2 em{font-style:normal;color:var(--text3);margin-left:4px}
.ln2 em.up{color:var(--acct)}
.chart{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible;cursor:crosshair}
.chart text{font-size:10px;fill:var(--text3);font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .raw{fill:none;stroke:var(--text3);stroke-width:1;opacity:.55}
.chart .rd{fill:var(--text3)}
.chart .trend{fill:none;stroke:var(--lime);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .cur line{stroke:var(--line2);stroke-width:1}
.chart .cur circle{fill:var(--bg);stroke:var(--lime);stroke-width:2}

<body>
<div id="app"><div id="view"></div><div id="mini"></div><nav id="nav"></nav></div>
<div id="wo"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= UTIL ================= */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const nf=n=>Math.round(n).toLocaleString('en-GB');
const ic=d=>`<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const IC={
  dashboard:ic('<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="4" rx="1.500"/><rect x="13" y="11" width="7" height="9" rx="2"/><rect x="4" y="14" width="7" height="6" rx="2"/>'),
  routines:ic('<path d="M9 6h11M9 12h11M9 18h11M4.500 6h.01M4.500 12h.01M4.500 18h.01"/>'),
  history:ic('<circle cx="12" cy="12" r="8.500"/><path d="M12 7v5l3.500 2"/>'),
  body:ic('<circle cx="12" cy="5" r="2.500"/><path d="M5 10.500h14M12 10.500V16M8 21l4-5 4 5"/>'),
  settings:ic('<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.500"/><circle cx="8" cy="17" r="2.500"/>'),
  back:ic('<path d="M15 5l-7 7 7 7"/>'), chev:ic('<path d="M9 5l7 7-7 7"/>'), x:ic('<path d="M6 6l12 12M18 6L6 18"/>'),
  grip:ic('<path d="M5 9h14M5 15h14"/>'), check:ic('<path d="M5 12.500l4.500 4.500L19 7.500"/>'), plus:ic('<path d="M12 5v14M5 12h14"/>'),
  pin:ic('<path d="M12 16v5M8.500 4h7l-1 6 3 4h-11l3-4z"/>'), dots:ic('<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="2.600"/>'),
  play:ic('<path d="M8 5l11 7-11 7z"/>'), down:ic('<path d="M5 9l7 7 7-7"/>'),
  menu:ic('<path d="M5 9h14M9 15h10"/>'),
};
const MARK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.200 10.300a4.800 4.800 0 019.600 0v8a1.600 1.600 0 01-3.200 0 1.600 1.600 0 01-3.200 0 1.600 1.600 0 01-3.200 0z" fill="#F2F2EE"/><ellipse cx="10.300" cy="10.300" rx=".850" ry="1.250" fill="#29292C"/><ellipse cx="13.700" cy="10.300" rx=".850" ry="1.250" fill="#29292C"/><path d="M2.500 15h19M4.400 12.800v4.400M19.600 12.800v4.400" stroke="#D62442" stroke-width="1.500" stroke-linecap="round" fill="none"/></svg>';

/* ================= MODELS ================= */
const GROUPS=['Chest','Back','Shoulders','Biceps','Triceps','Forearms','Quads','Hamstrings','Glutes','Calves','Core','Full Body','Cardio'];
const EQUIP=['Barbell','Dumbbell','Machine','Cable','Bodyweight','Kettlebell','Smith','Band','Other'];
const EQ={B:'Barbell',D:'Dumbbell',M:'Machine',C:'Cable',W:'Bodyweight',K:'Kettlebell',S:'Smith',O:'Other'};
const SET_TYPES=['warmup','normal','backoff','drop','myo','failure'];
const SEED={
 'Chest':'Barbell Bench Press:B,Incline Barbell Bench Press:B,Decline Barbell Bench Press:B,Dumbbell Bench Press:D,Incline Dumbbell Press:D,Dumbbell Fly:D,Cable Crossover:C,Machine Chest Press:M,Pec Deck:M,Smith Machine Bench Press:S,Push-Up:W,Dip:W',
 'Back':'Deadlift:B,Barbell Row:B,Pendlay Row:B,T-Bar Row:B,Rack Pull:B,Dumbbell Row:D,Pull-Up:W,Chin-Up:W,Lat Pulldown:C,Seated Cable Row:C,Straight-Arm Pulldown:C,Machine Row:M,Chest-Supported Row:M,Back Extension:W',
 'Shoulders':'Overhead Press:B,Seated Dumbbell Shoulder Press:D,Arnold Press:D,Machine Shoulder Press:M,Dumbbell Lateral Raise:D,Cable Lateral Raise:C,Front Raise:D,Rear Delt Fly:D,Reverse Pec Deck:M,Face Pull:C,Upright Row:B,Barbell Shrug:B,Dumbbell Shrug:D',
 'Biceps':'Barbell Curl:B,EZ-Bar Curl:B,Dumbbell Curl:D,Hammer Curl:D,Incline Dumbbell Curl:D,Preacher Curl:M,Cable Curl:C,Concentration Curl:D',
 'Triceps':'Close-Grip Bench Press:B,Skull Crusher:B,Triceps Pushdown:C,Overhead Cable Triceps Extension:C,Dumbbell Overhead Triceps Extension:D,Triceps Kickback:D,Bench Dip:W',
 'Forearms':'Wrist Curl:B,Reverse Curl:B,Farmer\'s Carry:D',
 'Quads':'Back Squat:B,Front Squat:B,Leg Press:M,Hack Squat:M,Leg Extension:M,Bulgarian Split Squat:D,Walking Lunge:D,Goblet Squat:K,Smith Machine Squat:S,Step-Up:D,Pistol Squat:W',
 'Hamstrings':'Romanian Deadlift:B,Dumbbell Romanian Deadlift:D,Stiff-Leg Deadlift:B,Lying Leg Curl:M,Seated Leg Curl:M,Good Morning:B,Nordic Curl:W',
 'Glutes':'Hip Thrust:B,Sumo Deadlift:B,Glute Bridge:W,Cable Kickback:C,Cable Pull-Through:C,Hip Abduction:M,Hip Adduction:M,Kettlebell Swing:K',
 'Calves':'Standing Calf Raise:M,Seated Calf Raise:M,Leg Press Calf Raise:M',
 'Core':'Plank:W,Side Plank:W,Hanging Leg Raise:W,Ab Wheel Rollout:W,Crunch:W,Sit-Up:W,Russian Twist:W,Cable Crunch:C,Pallof Press:C',
 'Full Body':'Power Clean:B,Clean and Press:B,Thruster:B,Turkish Get-Up:K,Burpee:W',
 'Cardio':'Running:O,Treadmill Run:M,Walking:O,Hiking:O,Cycling:O,Stationary Bike:M,Rowing Machine:M,Elliptical:M,Stair Climber:M,Swimming:O,Jump Rope:O,Treadmill Walk:M,Spin Bike:M,Air Bike:M,SkiErg:M'
};
function seedExercises(){
  const out=[];
  for(const g in SEED)for(const s of SEED[g].split(',')){
    const [name,e]=s.split(':');
    out.push({id:'ex_'+slug(name),name,group:g,equip:EQ[e],bw:e==='W',kind:g==='Cardio'?'cardio':'strength',custom:false,archived:false,restSec:null,increment:null});
  }
  return out;
}
function freshDB(){
  return {v:1,exercises:seedExercises(),routines:[],workouts:[],bodyweights:[],measurements:[],cards:[],rest:null,
    settings:{unit:'kg',restSec:120,increment:2.5,heightCm:null,birthYear:null,sex:null}};
}
function migrate(d){
  const base=freshDB();
  for(const k in base)if(d[k]==null)d[k]=base[k];
  d.settings={...base.settings,...d.settings};
  const have=new Set(d.exercises.map(x=>x.id));
  for(const x of base.exercises)if(!have.has(x.id))d.exercises.push(x);
  return d;
}
/* Model factories (later-phase fields rir/rpe/healthKitId are reserved, unused) */
const M={
  routine:(name='')=>({id:uid(),name,createdAt:Date.now(),items:[]}),
  routineItem:exId=>({id:uid(),exerciseId:exId,plannedSets:3,repMin:8,repMax:12,note:''}),
  workout:(o={})=>({id:uid(),startedAt:Date.now(),endedAt:null,name:'',routineId:null,isDeload:false,note:'',exercises:[],...o}),
  workoutExercise:(exId,o={})=>({id:uid(),exerciseId:exId,repMin:null,repMax:null,note:'',pinned:true,sets:[],...o}),
  set:(o={})=>({id:uid(),type:'normal',weightKg:null,reps:null,done:false,doneAt:null,distanceM:null,durationSec:null,speedKmh:null,inclinePct:null,level:null,sw:null,pr:false,rir:null,rpe:null,...o}),
  exercise:()=>({id:'ex_'+uid(),name:'',group:'Chest',equip:'Barbell',bw:false,kind:'strength',custom:true,archived:false,restSec:null,increment:null}),
};

/* ================= STORAGE (IndexedDB → localStorage → memory) ================= */
const Store={
  idb:null,timer:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('vigil',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{this.idb=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res();
    setTimeout(res,1500)}catch(e){res()}})},
  async load(){
    if(this.idb){try{const v=await new Promise((res,rej)=>{const q=this.idb.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>res(q.result);q.onerror=()=>rej()});if(v)return v}catch(e){}}
    try{const s=localStorage.getItem('vigil-db');if(s)return JSON.parse(s)}catch(e){}
    return null;
  },
  flush(){clearTimeout(this.timer);this.timer=null;
    if(this.idb){try{this.idb.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(db)),'db');return}catch(e){}}
    try{localStorage.setItem('vigil-db',JSON.stringify(db))}catch(e){}},
  save(){if(!this.timer)this.timer=setTimeout(()=>this.flush(),200)}
};
let db=freshDB();
const save=()=>Store.save();
const exById=id=>db.exercises.find(x=>x.id===id);
const exName=id=>exById(id)?.name||'Deleted exercise';
const exUsed=id=>db.routines.some(r=>r.items.some(i=>i.exerciseId===id))||db.workouts.some(w=>w.exercises.some(e=>e.exerciseId===id));

/* ================= SAMPLE DATA ================= */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function loadSample(){
  const R=rng(7),E=n=>'ex_'+slug(n),DAY=864e5;
  const plan=[
   ['Push',[['Barbell Bench Press',3,6,8,80,2.5],['Incline Dumbbell Press',3,8,12,26,1],['Overhead Press',3,6,10,45,2.5],['Dumbbell Lateral Raise',3,12,15,9,1],['Triceps Pushdown',3,10,15,25,2.5]]],
   ['Pull',[['Deadlift',2,3,5,130,2.5],['Pull-Up',3,6,10,0,2.5],['Barbell Row',3,8,10,65,2.5],['Face Pull',3,12,15,20,2.5],['Dumbbell Curl',3,10,12,12,1]]],
   ['Legs',[['Back Squat',3,5,8,100,2.5],['Romanian Deadlift',3,8,10,85,2.5],['Leg Press',3,10,12,160,5],['Lying Leg Curl',3,10,12,40,2.5],['Standing Calf Raise',3,12,15,60,2.5]]]];
  const d=freshDB();d.settings=db.settings;
  d.routines=plan.map(([name,items])=>({...M.routine(name),items:items.map(([n,s,a,b])=>({...M.routineItem(E(n)),plannedSets:s,repMin:a,repMax:b}))}));
  const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  for(let w=11;w>=0;w--){
    const deload=w===4,f=(1+(11-w)*.012)*(deload?.8:1);
    [0,2,4].forEach((dow,pi)=>{
      const t=mon.getTime()-w*7*DAY+dow*DAY+18*36e5;
      if(t>Date.now()||R()<.1)return;
      const [name,items]=plan[pi];
      const wo=M.workout({startedAt:t,endedAt:t+(55+Math.floor(R()*25))*6e4,name,routineId:d.routines[pi].id,isDeload:deload});
      items.forEach(([n,s,a,b,base,stp],xi)=>{
        const we=M.workoutExercise(E(n),{repMin:a,repMax:b});
        const kg=Math.round(base*f/stp)*stp;
        if(xi===0)we.sets.push(M.set({type:'warmup',weightKg:Math.round(kg*.5/2.5)*2.5,reps:8,done:true,doneAt:t}));
        for(let k=0;k<s;k++)we.sets.push(M.set({weightKg:kg,reps:clamp(a+Math.floor(R()*(b-a+1))-k+1,a-1,b),done:true,doneAt:t+k*18e4}));
        wo.exercises.push(we);
      });
      d.workouts.push(wo);
    });
    const ts=mon.getTime()-w*7*DAY+5*DAY+9*36e5;
    if(ts<Date.now()&&R()<.65){
      const km=3+Math.round(R()*10)/2;
      const wo=M.workout({startedAt:ts,endedAt:ts+km*330e3,name:'Run'});
      wo.exercises.push(M.workoutExercise(E('Running'),{sets:[M.set({distanceM:km*1000,durationSec:Math.round(km*330),done:true,doneAt:ts})]}));
      d.workouts.push(wo);
    }
  }
  for(let i=84;i>=0;i-=(R()<.5?2:3))d.bodyweights.push({id:uid(),date:Date.now()-i*DAY,weightKg:Math.round((78.5-2*(84-i)/84+(R()-.5)*.8)*10)/10});
  for(let i=3;i>=0;i--){const dt=Date.now()-i*28*DAY;
    d.measurements.push({id:uid(),date:dt,site:'Waist',valueCm:Math.round((86-(3-i)*.6)*10)/10},{id:uid(),date:dt,site:'Arms',valueCm:Math.round((38+(3-i)*.2)*10)/10})}
  const best={};d.workouts.sort((a,b)=>a.startedAt-b.startedAt).forEach(w=>w.exercises.forEach(e=>{const top=bestSet(e.sets),b=best[e.exerciseId]||0;
    if(top&&e1rm(top)>b){if(b&&!w.isDeload)top.pr=true;best[e.exerciseId]=e1rm(top)}}));
  d.cards=[];d.settings.cardsSet=false;
  db=d;Store.flush();
}

/* ================= DERIVED DATA ================= */
const DAY=864e5;
const dayStart=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const weekStart=off=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)+off*7)};
const addDays=(d,i)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+i).getTime();
const wVol=w=>w.exercises.reduce((m,e)=>m+e.sets.reduce((k,s)=>k+(s.done&&s.weightKg&&s.reps?s.weightKg*s.reps:0),0),0);
const wSets=w=>w.exercises.reduce((m,e)=>m+e.sets.filter(s=>s.done).length,0);
const wDist=w=>w.exercises.reduce((m,e)=>m+e.sets.reduce((k,s)=>k+(s.done&&s.distanceM||0),0),0);
const wMin=w=>w.endedAt?Math.round((w.endedAt-w.startedAt)/6e4):0;
const wMeta=w=>{const d=wDist(w),v=wVol(w);return (d&&!v?(d/1000).toFixed(1)+' km':wSets(w)+' sets')+(wMin(w)?' · '+wMin(w)+' min':'')};
const dispW=kg=>db.settings.unit==='lbs'?kg*2.20462:kg;
const volBetween=(a,b)=>db.workouts.reduce((n,w)=>n+(w.startedAt>=a&&w.startedAt<b?wVol(w):0),0);

/* ================= UI STATE ================= */
const ui={tab:'dashboard',seg:'routines',stack:[],sheet:null,libQ:'',libG:'All',lastKey:'',nav:'tab',weekOff:0,day:dayStart(Date.now()),openW:null,woOpen:false,f:null,sum:null,hseg:'list',calM:0,calDay:null,editId:null,bseg:'weight',bper:90,bwAll:false,prG:'All',dper:90};
let ANIM=false;
const app=$('#app'),view=$('#view'),navEl=$('#nav'),sheetEl=$('#sheet');
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600)}
function confirmSheet(title,msg,ok,fn,danger=true){ui.sheet={type:'confirm',title,msg,ok,fn,danger};renderSheet()}

/* ================= RENDER ================= */
const TABS=[['dashboard','Dashboard'],['routines','Routines'],['history','History'],['body','Body'],['settings','Settings']];
navEl.innerHTML=`<i class="ind"></i>`+TABS.map(([k,l])=>`<button data-act="tab" data-k="${k}" aria-label="${l}">${IC[k]}</button>`).join('');
const topbar=(title,right='')=>`<div class="tb"><span class="mark">${MARK}</span><h1>${title}</h1>${right||'<span class="mark"></span>'}</div>`;
function render(){
  const top=ui.stack[ui.stack.length-1];
  const key=top?top.page+top.id:ui.tab+ui.seg+(ui.tab==='history'?ui.hseg:ui.tab==='body'?ui.bseg:'');
  const changed=key!==ui.lastKey,c=$('.content'),st=c&&!changed?c.scrollTop:0;
  const heroIn=changed&&!top&&ui.nav==='tab';
  ANIM=changed||ANIM;
  const p=top?(top.page==='session'?pageSession(top.id):pageRoutine(top.id)):({dashboard:pageDash,routines:pageRoutines,history:pageHistory,
    body:pageBody,settings:pageSettings})[ui.tab]();
  view.innerHTML=(p.hero?`<header class="hero ${heroIn?'in':''}">${p.hero}</header>`:`<header class="bar">${p.bar}</header>`)+
    `<main class="content ${changed&&ui.nav!=='none'?'in-'+ui.nav:''}">${p.body}</main>`;
  $('.content').scrollTop=st;
  app.classList.toggle('sub',!!top);
  const i=TABS.findIndex(t=>t[0]===ui.tab);
  navEl.querySelector('.ind').style.transform=`translateX(${i*100}%)`;
  navEl.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i));
  if(changed)countUp();ANIM=false;
  ui.lastKey=key;ui.nav='tab';
}
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;if(!to)return;const t0=performance.now();
    const f=t=>{const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=nf(to*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
function pageSoon(t,stage,msg){return {hero:topbar(t),body:`<div class="empty"><b>${stage}</b>${msg}</div>`}}
function spark(v,W=170,H=46){
  const mx=Math.max(...v),mn=Math.min(...v),rg=mx-mn||1,r=n=>Math.round(n*10)/10;
  const p=v.map((y,i)=>[r(5+i*(W-10)/(v.length-1)),r(H-7-(y-mn)/rg*(H-16))]);
  let d=`M${p[0][0]} ${p[0][1]}`;
  for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],cx=r((x0+x1)/2);d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
  const [ex,ey]=p[p.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0314D" stop-opacity=".28"/><stop offset="1" stop-color="#E0314D" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${ex} ${H} L${p[0][0]} ${H}Z" fill="url(#sg)"/><path class="${ANIM?'draw':''}" pathLength="1" d="${d}" fill="none" stroke="#E0314D" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="${ex}" cy="${ey}" r="3.500" fill="#29292C" stroke="#E0314D" stroke-width="1.700"/></svg>`;
}

/* ---- Dashboard ---- */
function daySummary(){
  const ws=db.workouts.filter(w=>dayStart(w.startedAt)===ui.day),d=new Date(ui.day);
  const cap=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  if(!ws.length)return `<div class="cap">${cap}</div><div class="dn" style="color:var(--ink3)">${ui.day>Date.now()?'Upcoming':'Rest day'}</div><div class="cap">No session</div>`;
  return `<div class="cap">${cap}</div><div class="dn">${esc(ws.map(w=>w.name||'Workout').join(' + '))}${ws.some(w=>w.isDeload)?' · deload':''}</div><div class="cap num">${ws.length>1?ws.length+' sessions':wMeta(ws[0])}</div>`;
}
function pageDash(){
  const ws=weekStart(ui.weekOff),days=[...Array(7)].map((_,i)=>addDays(ws,i)),today=dayStart(Date.now());
  const a=ws.getTime(),b=addDays(ws,7),vol=dispW(volBetween(a,b)),prev=dispW(volBetween(addDays(ws,-7),a));
  const series=[...Array(8)].map((_,i)=>volBetween(addDays(ws,(i-7)*7),addDays(ws,(i-6)*7)));
  const pct=prev?Math.round((vol-prev)/prev*100):null;
  const strip=days.map(t=>{const n=db.workouts.filter(w=>dayStart(w.startedAt)===t).length,d=new Date(t);
    return `<button class="day ${n?'has':''} ${t===today?'today':''} ${t===ui.day?'on':''}" data-act="day" data-t="${t}" aria-label="${d.toDateString()}">
      <b class="num">${d.getDate()}</b><span>${d.toLocaleDateString('en-GB',{weekday:'short'}).toLowerCase()}</span><i>${'<u></u>'.repeat(Math.min(n,3))}</i></button>`}).join('');
  const hero=topbar('Dashboard',`<button class="cbtn" data-act="tab" data-k="settings" aria-label="Settings">${IC.menu}</button>`)+`
    <div class="wk"><button class="cbtn" data-act="wk" data-d="-1" aria-label="Previous week">${IC.back}</button>
      <span>${ui.weekOff===0?'This week':ui.weekOff===-1?'Last week':ws.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+new Date(days[6]).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
      <button class="cbtn" data-act="wk" data-d="1" ${ui.weekOff>=0?'disabled':''} aria-label="Next week">${IC.chev}</button></div>
    <div class="days">${strip}</div>
    <div class="statc"><div class="grow"><div class="cap">Volume${pct!=null&&vol&&ui.weekOff<0?`<span class="delta ${pct<0?'neg':''}">${pct>=0?'+':''}${pct}%</span>`:''}</div>
        <div class="big num"><span data-count="${Math.round(vol)}">${nf(vol)}</span><small>${db.settings.unit}</small></div>${spark(series)}</div>
      <div class="dsum" id="dsum">${daySummary()}</div></div>`;
  const cards=db.routines.map((r,i)=>`<button class="glow press" data-act="rOpen" data-id="${r.id}">
      <div class="gt">${esc(r.name)||'Untitled'}</div><div class="gs num">${r.items.length} exercises · ${r.items.reduce((n,x)=>n+x.plannedSets,0)} sets</div>
      <span class="go">${IC.chev}</span><i class="blob b${i%3}"></i></button>`).join('');
  const recent=db.workouts.filter(w=>w.endedAt).sort((x,y)=>y.startedAt-x.startedAt).slice(0,4).map(w=>`
    <div class="soft rec ${ui.openW===w.id?'open':''}" data-act="wOpen" data-id="${w.id}">
      <div class="rowc"><div class="grow"><div class="h3 ell">${esc(w.name)||'Workout'}${w.isDeload?'<span class="tag">Deload</span>':''}</div>
        <div class="s num">${new Date(w.startedAt).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · ${wMeta(w)}</div></div><span class="chv">${IC.chev}</span></div>
      <div class="more"><div>${w.exercises.map(e=>{const s=e.sets.filter(x=>x.done&&x.type!=='warmup'),t=s.reduce((m,x)=>(x.weightKg||0)>(m.weightKg||0)?x:m,s[0]||{});
        return `<div class="ln"><span class="ell">${esc(exName(e.exerciseId))}</span><b class="num">${t.distanceM?(t.distanceM/1000).toFixed(1)+' km':s.length+' × '+(t.weightKg?Math.round(dispW(t.weightKg)*10)/10+' '+db.settings.unit:(t.reps||0)+' reps')}</b></div>`}).join('')}<div class="ln"><span></span><button class="lnk" style="color:var(--acct);padding:0" data-act="sessOpen" data-id="${w.id}">Open session</button></div></div></div>
    </div>`).join('');
  const stale=finished().length>=3&&Date.now()-(db.settings.lastBackup||0)>14*DAY;
  const body=`${stale?`<div class="soft nudge"><div class="grow"><div>Back up your data</div><div class="s">${db.settings.lastBackup?'Last backup '+dfmt(db.settings.lastBackup,{day:'numeric',month:'short'}):'No backup made yet'}</div></div><button class="pillbtn press" data-act="expJSON">Export</button></div>`:''}<div class="sec"><h2>Routines</h2>${db.routines.length?`<button class="lnk" data-act="tab" data-k="routines">See all</button>`:''}</div>
    <div class="car">${cards}<button class="glow add press" data-act="rNew"><div><span class="go">${IC.plus}</span>New routine</div></button></div>
    <div style="height:12px"></div><button class="btn" data-act="woStart">${IC.play} Start empty workout</button>
    ${progressHTML()}
    <h2>Recent</h2>
    ${recent?`<div class="stack">${recent}</div>`:`<div class="soft" style="text-align:center;padding:26px 20px"><div class="s" style="margin:0 0 14px;line-height:1.5">No sessions yet. Load sample data to see the dashboard in motion.</div><button class="btn pri" data-act="sample">Load sample data</button></div>`}`;
  return {hero,body};
}

function chipsHTML(cur,act,extra){
  return ['All',...GROUPS,...(extra?['Custom','Archived']:[])].map(g=>`<button class="chip ${cur===g?'on':''}" data-act="${act}" data-k="${g}">${g}</button>`).join('');
}
function chipSet(sel,k){document.querySelectorAll(sel+' .chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k))}
function exFilter(q,g){
  q=q.trim().toLowerCase();
  return db.exercises.filter(x=>(g==='Archived'?x.archived:!x.archived)&&(g==='All'||g==='Archived'||(g==='Custom'?x.custom:x.group===g))&&(!q||x.name.toLowerCase().includes(q)))
    .sort((a,b)=>GROUPS.indexOf(a.group)-GROUPS.indexOf(b.group)||a.name.localeCompare(b.name));
}
function exListHTML(q,g,sel){
  const list=exFilter(q,g);
  if(!list.length)return `<div class="empty"><b>Nothing found</b>${q?'No exercise matches that search. Add it as a custom exercise.':'Nothing here yet.'}</div>`;
  let out='',last='';
  for(const x of list){
    if(x.group!==last&&(g==='All'||g==='Custom'||g==='Archived')){out+=`<div class="grp">${x.group}</div>`;last=x.group}
    const on=sel&&sel.includes(x.id);
    out+=`<div class="ex ${on?'sel':''}" data-act="${sel?'pickTog':'exOpen'}" data-id="${x.id}">
      <div class="grow"><div class="nm ell">${esc(x.name)}${x.custom?'<span class="tag y">Custom</span>':''}${x.bw?'<span class="tag">BW</span>':''}</div>
      <div class="s">${x.group} · ${x.equip}</div></div>
      ${sel?`<span class="box">${IC.check}</span>`:`<span class="chv">${IC.chev}</span>`}</div>`;
  }
  return out;
}

function closeSheet(){ui.sheet=null;sheetEl.className='';sheetEl.innerHTML=''}

  let h='';
  if(s.type==='confirm')h=`<div class="panel"><div class="phead"><h2>${esc(s.title)}</h2></div><div class="pbody" style="color:var(--text2);line-height:1.55;padding-top:4px">${esc(s.msg)}</div>

      <button class="mrow" style="color:var(--danger)" data-act="setDel"><span class="st" style="display:grid;place-items:center;color:var(--danger)">${IC.x}</span>Delete set</button></div><div class="pfoot" style="padding-top:0"></div></div>`}
  if(s.type==='wmenu'){const we=curW().exercises[s.e];h=`<div class="panel"><div class="phead"><h2 class="ell">${esc(exName(we.exerciseId))}</h2><button class="cbtn" data-act="closeSheet" aria-label="Close">${IC.x}</button></div>
    <div class="pbody" style="padding-top:0"><button class="mrow" data-act="wSwap">Swap exercise</button><button class="mrow" data-act="wNote">${we.showNote?'Hide note':we.note?'Edit note':'Add note'}</button>
      <button class="mrow" style="color:var(--danger)" data-act="wDel">Remove from workout</button></div><div class="pfoot" style="padding-top:0"></div></div>`}

    <div style="padding:4px 20px 0"><input class="inp" type="search" placeholder="Search exercises" value="${esc(s.q)}" data-in="pickQ" autocomplete="off" autocorrect="off">
      <div class="chips" id="pickChips" style="margin:12px -20px 0;padding:0 20px">${chipsHTML(s.g,'pickG')}</div></div>

  if(s.type==='ex'){const d=s.d,lock=!d.custom;
    h=`<div class="panel ${na}"><div class="phead"><h2>${s.isNew?'New exercise':lock?'Exercise':'Edit exercise'}</h2><button class="cbtn" data-act="closeSheet" aria-label="Close">${IC.x}</button></div>

      </div>

  sheetEl.innerHTML=`<div class="back" data-act="closeSheet" ${noanim?'style="animation:none"':''}></div>${h}`;sheetEl.className='open';
}

/* ================= ACTIONS ================= */
const A={
  tab(d){if(ui.tab===d.k&&!ui.stack.length)return;ui.tab=d.k;ui.stack=[];render()},
  seg(d){ui.seg=d.k;render()},

/* drag to reorder, and drag a sheet down to dismiss */
document.addEventListener('pointerdown',e=>{
  const ph=e.target.closest('.phead');
  if(ph&&!e.target.closest('button')){
    const panel=ph.parentElement;let y0=e.clientY,dy=0;try{ph.setPointerCapture(e.pointerId)}catch(_){}
    panel.style.animation='none';panel.style.transition='none';
    const mv=ev=>{dy=Math.max(0,ev.clientY-y0);panel.style.transform=`translateY(${dy}px)`};
    const up=()=>{ph.removeEventListener('pointermove',mv);ph.removeEventListener('pointerup',up);ph.removeEventListener('pointercancel',up);
      panel.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';
      if(dy>110){panel.style.transform='translateY(100%)';setTimeout(()=>A.closeSheet(),200)}else panel.style.transform=''};
    ph.addEventListener('pointermove',mv);ph.addEventListener('pointerup',up);ph.addEventListener('pointercancel',up);return;
  }
  const h=e.target.closest('[data-drag]');if(!h)return;
  const row=h.closest('[data-row]'),list=row.parentElement,kind=h.dataset.drag;
  e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(_){}
  let y0=e.clientY;row.classList.add('drag');
  const move=ev=>{
    const shift=sib=>{const a=row.offsetTop;sib===row.previousElementSibling?list.insertBefore(row,sib):list.insertBefore(sib,row);y0+=row.offsetTop-a};
    const p=row.previousElementSibling,n=row.nextElementSibling;
    if(p){const r=p.getBoundingClientRect();if(ev.clientY<r.top+r.height/2)shift(p)}
    if(n){const r=n.getBoundingClientRect();if(ev.clientY>r.top+r.height/2)shift(n)}
    row.style.transform=`translateY(${ev.clientY-y0}px) scale(1.02)`;
  };
  const up=()=>{
    h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    row.classList.remove('drag');row.style.transform='';
    const ids=[...list.querySelectorAll(':scope>[data-row]')].map(x=>x.dataset.id);
    if(kind==='routines')db.routines.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
    else if(kind==='cards'){db.cards.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save();render();return renderSheet(true)}
    else{const r=curRoutine();r.items.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id))}
    save();render();
  };
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});

/* ================= ACTIVE WORKOUT ================= */
const woEl=$('#wo'),miniEl=$('#mini');
const r2=n=>Math.round(n*100)/100;
const activeW=()=>db.workouts.find(w=>!w.endedAt);
const curW=()=>ui.editId?db.workouts.find(w=>w.id===ui.editId):activeW();
const clock=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const isCardio=we=>exById(we.exerciseId)?.kind==='cardio';
/* which values a cardio machine asks for */
function cFields(x){const n=(x?.name||'').toLowerCase();
  if(/treadmill/.test(n))return['dur','dist','speed','inc'];
  if(/bike|elliptical|cross|ski|row/.test(n))return['dur','dist','lvl'];
  if(/stair|step/.test(n))return['dur','lvl'];
  if(/rope/.test(n))return['dur'];
  return['dur','dist'];
}
const fieldsOf=we=>isCardio(we)?cFields(exById(we.exerciseId)):['weight','reps'];
const F={
  weight:{label:()=>db.settings.unit,dec:1,get:s=>s.weightKg==null?null:r2(dispW(s.weightKg)),set:(s,v)=>s.weightKg=v==null?null:(db.settings.unit==='lbs'?v/2.20462:v)},
  reps:{label:()=>'reps',step:1,get:s=>s.reps,set:(s,v)=>s.reps=v==null?null:Math.round(v)},
  dur:{label:()=>'Time',time:1,step:60,get:s=>s.durationSec,set:(s,v)=>s.durationSec=v==null?null:Math.round(v)},
  dist:{label:()=>'Distance · km',dec:1,step:.1,get:s=>s.distanceM==null?null:r2(s.distanceM/1000),set:(s,v)=>s.distanceM=v==null?null:Math.round(v*1000)},
  speed:{label:()=>'Speed · km/h',dec:1,step:.5,get:s=>s.speedKmh??null,set:(s,v)=>s.speedKmh=v},
  inc:{label:()=>'Incline · %',dec:1,step:.5,get:s=>s.inclinePct??null,set:(s,v)=>s.inclinePct=v},
  lvl:{label:()=>'Level',step:1,get:s=>s.level??null,set:(s,v)=>s.level=v==null?null:Math.round(v)},
};
const fmtV=(k,v)=>F[k].time?clock(v):String(v);
const bufSec=b=>{const n=parseInt(b)||0;return Math.floor(n/100)*60+Math.min(n%100,59)};
const liveDur=s=>(s.durationSec||0)+(s.sw?Math.floor((Date.now()-s.sw)/1000):0);
const e1rm=s=>s.weightKg&&s.reps?(s.reps===1?s.weightKg:s.weightKg*(1+s.reps/30)):0;
const score=s=>e1rm(s)||s.reps||0;
const bestSet=sets=>sets.filter(s=>s.done&&s.type!=='warmup').reduce((m,s)=>!m||score(s)>score(m)?s:m,null);
function newWE(exId,it){const c=exById(exId)?.kind==='cardio';
  return M.workoutExercise(exId,{repMin:it?.repMin??null,repMax:it?.repMax??null,note:it?.note||'',sets:[...Array(c?1:(it?.plannedSets||3))].map(()=>M.set())})}
function prevEx(exId,w){let b=null;
  for(const o of db.workouts){if(o===w||!o.endedAt||o.isDeload||o.startedAt>=w.startedAt)continue;
    const e=o.exercises.find(e=>e.exerciseId===exId&&e.sets.some(s=>s.done));if(e&&(!b||o.startedAt>b.t))b={t:o.startedAt,e}}
  return b?b.e:null}
function prevSet(pe,we,s){if(!pe)return null;const i=we.sets.filter(x=>x.type===s.type).indexOf(s);return pe.sets.filter(x=>x.done&&x.type===s.type)[i]||null}
function bestBefore(exId,w){let m=0;for(const o of db.workouts)if(o!==w&&o.endedAt&&o.startedAt<w.startedAt)for(const e of o.exercises)if(e.exerciseId===exId)for(const s of e.sets)if(s.done&&s.type!=='warmup')m=Math.max(m,e1rm(s));return m}
function phVal(pe,we,s,k){const p=prevSet(pe,we,s);let v=p?F[k].get(p):null;
  if(v==null&&!isCardio(we))for(let i=we.sets.indexOf(s)-1;i>=0&&v==null;i--)v=F[k].get(we.sets[i]);
  return v}
const TYPES={warmup:['W','Warm-up'],normal:['1','Normal'],backoff:['B','Backoff'],drop:['D','Drop set'],myo:['M','Myo-rep'],failure:['F','Failure']};
const setLabel=(we,s)=>s.type==='normal'?we.sets.filter(x=>x.type==='normal').indexOf(s)+1:TYPES[s.type][0];

/* ---- calories (estimate): MET × body weight × hours ---- */
function bodyKg(){const b=db.bodyweights;return b.length?b.reduce((m,x)=>x.date>m.date?x:m).weightKg:null}
/* personal factor: standard MET tables assume a resting rate of 3.5 ml/kg/min; with height, age and sex known, scale to the user's own (Mifflin-St Jeor) */
function pf(){const s=db.settings,kg=bodyKg();if(!kg||!s.heightCm||!s.birthYear||!s.sex)return 1;
  const rmr=10*kg+6.25*s.heightCm-5*(new Date().getFullYear()-s.birthYear)+(s.sex==='m'?5:-161);
  return clamp(3.5/(rmr/1440/5/kg*1000),.8,1.3)}
function metCardio(x,s){const n=(x?.name||'').toLowerCase(),h=(s.durationSec||0)/3600,kmh=s.distanceM&&h?s.distanceM/1000/h:(s.speedKmh||0),g=(s.inclinePct||0)/100;
  if(/treadmill|run|walk|hik/.test(n)&&kmh){const v=kmh*1000/60;return ((kmh>=7.5?.2*v+.9*v*g:.1*v+1.8*v*g)+3.5)/3.5}
  const m=/treadmill|run|walk|hik/.test(n)?(/run/.test(n)?9:/hik/.test(n)?6:3.8):/air bike/.test(n)?10:/bike|cycl/.test(n)?(!kmh?6.8:kmh<16?4:kmh<19?6.8:kmh<22?8:kmh<26?10:12)
    :/row|ski/.test(n)?7:/elliptical|cross/.test(n)?5:/stair|step/.test(n)?9:/swim/.test(n)?6:/rope/.test(n)?11:6;
  return m*pf()}
function wKcal(w){const kg=bodyKg();if(!kg)return null;let k=0,cs=0,lift=false;
  for(const e of w.exercises){const x=exById(e.exerciseId);
    for(const s of e.sets)if(s.done){if(x?.kind==='cardio'){if(s.durationSec){k+=metCardio(x,s)*kg*s.durationSec/3600;cs+=s.durationSec}}else lift=true}}
  if(lift)k+=5*pf()*kg*Math.max(0,((w.endedAt||Date.now())-w.startedAt)/1000-cs)/3600;
  return Math.round(k)}

/* ---- sound, screen wake ---- */
let AC,wl;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{if(!AC)return;[0,.28,.56].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+t;o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.35,a+.02);g.gain.exponentialRampToValueAtTime(.0001,a+.22);o.start(a);o.stop(a+.24)})}catch(e){}}
async function wake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wl&&wl.release()}catch(e){}wl=null}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---- render ---- */
function fldHTML(pe,we,s,ei,si,k,tile){
  const on=ui.f&&ui.f.e===ei&&ui.f.s===si&&ui.f.k===k,def=F[k];let t;
  if(on&&ui.f.buf!=null)t=ui.f.buf===''?'':def.time?clock(bufSec(ui.f.buf)):ui.f.buf;
  else{const v=k==='dur'&&s.sw?liveDur(s):def.get(s);t=v==null?'':fmtV(k,v)}
  if(t===''){const p=s.done?null:phVal(pe,we,s,k);t=`<i>${p==null?(tile?'–':''):fmtV(k,p)}</i>`}
  const at=`data-act="fld" data-e="${ei}" data-s="${si}" data-k="${k}"`;
  return tile?`<button class="fld tile ${on?'on':''}" ${at}><span>${def.label()}</span><b class="num" ${k==='dur'&&s.sw?`data-sw="${ei},${si}"`:''}>${t}</b></button>`
    :`<button class="fld num ${on?'on':''}" ${at}>${t}</button>`;
}
function derived(x,s){const dur=liveDur(s),km=(s.distanceM||0)/1000,o=[];
  if(dur&&km){o.push(/row|ski/i.test(x.name)?clock(dur/(km*2))+' /500m':clock(dur/km)+' /km');o.push((km/(dur/3600)).toFixed(1)+' km/h')}
  const kg=bodyKg();if(kg&&dur)o.push('~'+Math.round(metCardio(x,{...s,durationSec:dur})*kg*dur/3600)+' kcal');
  return o.join(' · ')||(s.sw?'Timer running':ui.editId?'':'Start the timer or type the time')}
function cardHTML(w,we,ei){
  const x=exById(we.exerciseId),c=x?.kind==='cardio',pe=prevEx(we.exerciseId,w);
  const tgt=[we.repMin?`${we.repMin}–${we.repMax} reps`:'',we.showNote?'':we.note].filter(Boolean).join(' · ');
  let h=`<div class="soft wcard"><div class="whead"><div class="grow"><div class="h3 ell">${esc(x?.name||'Deleted exercise')}</div>
    ${tgt?`<button class="tgt ${we.pinned?'':'off'}" data-act="pin" data-e="${ei}">${IC.pin}<span class="ell">${we.pinned?esc(tgt):'Target hidden'}</span></button>`:`<div class="s">${x?x.group+' · '+x.equip:''}</div>`}</div>
    <button class="x" data-act="wMenu" data-e="${ei}" aria-label="Exercise options">${IC.dots}</button></div>`;
  if(we.showNote)h+=`<input class="inp note" placeholder="Note for this exercise" value="${esc(we.note)}" data-in="woNote" data-e="${ei}" maxlength="80">`;
  if(!c){
    h+=`<div class="thead"><span>Set</span><span>Previous</span><span>${x?.bw?'+':''}${db.settings.unit}</span><span>Reps</span><span></span></div>`;
    we.sets.forEach((s,si)=>{const p=prevSet(pe,we,s);
      h+=`<div class="srow ${s.done?'done':''}"><button class="st t-${s.type}" data-act="setType" data-e="${ei}" data-s="${si}" aria-label="Set type">${setLabel(we,s)}</button>
        <div class="pv num ${s.pr?'pr':''}">${s.pr?'PR · 1RM '+Math.round(dispW(e1rm(s))):p?`${p.weightKg?r2(dispW(p.weightKg)):(x?.bw?'BW':0)} × ${p.reps}`:'—'}</div>
        ${fldHTML(pe,we,s,ei,si,'weight')}${fldHTML(pe,we,s,ei,si,'reps')}
        <button class="chk ${ui.just===s.id?'bump':''}" data-act="setDone" data-e="${ei}" data-s="${si}" aria-label="Complete set">${IC.check}</button></div>`});
    h+=`<button class="addset" data-act="setAdd" data-e="${ei}">+ Add set</button>`;
  }else{
    const fs=cFields(x);
    we.sets.forEach((s,si)=>{h+=`<div class="cent ${s.done?'done':''}">${we.sets.length>1?`<div class="rowc" style="margin-top:12px"><span class="mini grow">Interval ${si+1}</span><button class="x" data-act="setDel2" data-e="${ei}" data-s="${si}" aria-label="Remove interval">${IC.x}</button></div>`:''}
      <div class="cgrid">${fs.map(k=>fldHTML(pe,we,s,ei,si,k,1)).join('')}</div>
      <div class="cfoot">${s.done||ui.editId?'':`<button class="swb ${s.sw?'run':''}" data-act="sw" data-e="${ei}" data-s="${si}">${s.sw?'Pause':s.durationSec?'Resume':'Start timer'}</button>`}<div class="der num">${derived(x,s)}</div>
        <button class="chk ${ui.just===s.id?'bump':''}" data-act="setDone" data-e="${ei}" data-s="${si}" aria-label="Complete">${IC.check}</button></div></div>`});
    h+=`<button class="addset" data-act="setAdd" data-e="${ei}">+ Add interval</button>`;
  }
  return h+'</div>';
}
function keypadHTML(w){
  const f=ui.f,we=w.exercises[f.e],s=we.sets[f.s],def=F[f.k],c=isCardio(we);

function exSeries(exId,kind,cut){
  return finished().reverse().filter(w=>w.startedAt>=cut&&!w.isDeload).map(w=>{let v=0;
    for(const e of w.exercises)if(e.exerciseId===exId){if(kind==='rm'){const b=bestSet(e.sets);if(b)v=Math.max(v,e1rm(b))}else v+=e.sets.reduce((n,s)=>n+(s.done&&s.type!=='warmup'&&s.weightKg&&s.reps?s.weightKg*s.reps:0),0)}
    return {t:w.startedAt,v:kind==='rm'?r1(dispW(v)):Math.round(dispW(v))}}).filter(p=>p.v>0);
}
function cardSeries(c){
  const cut=Date.now()-ui.dper*DAY,u=db.settings.unit;
  if(c.kind==='bw'){const all=[...db.bodyweights].sort((a,b)=>a.date-b.date),tr=ema(all.map(x=>dispW(x.weightKg)));
    return {title:'Bodyweight',sub:'Trend',chip:'Avg',unit:u,pts:all.map((x,i)=>({t:x.date,v:r1(tr[i])})).filter(p=>p.t>=cut)}}
  if(c.kind==='cardio'){const n=Math.ceil(ui.dper/7),ws=weekStart(0),fin=finished();
    return {title:'Cardio distance',sub:'Average per week',chip:'Week',unit:'km',bars:true,pts:[...Array(n)].map((_,i)=>{const a=addDays(ws,(i-n+1)*7),b=addDays(ws,(i-n+2)*7);
      return {t:a,v:r1(fin.reduce((m,w)=>m+(w.startedAt>=a&&w.startedAt<b?wDist(w):0),0)/1000)}})}}
  return {title:exName(c.exId),sub:c.kind==='rm'?'Est. 1RM':'Volume per session',chip:'Real',unit:u,pts:exSeries(c.exId,c.kind,cut)};
}
function miniChart(s){
  const v=s.pts.map(p=>p.v),W=150,H=50;
  if(s.bars){const mx=Math.max(...v,0);if(!mx)return '<div class="mce">No cardio in this period</div>';const bw=W/v.length;
    return `<svg class="mc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${v.map((y,i)=>{const h=Math.max(y?2:0,y/mx*(H-4));return `<rect x="${r1(i*bw+bw*.15)}" y="${r1(H-h)}" width="${r1(bw*.7)}" height="${r1(h)}" rx="1.500" fill="${i===v.length-1?'#E0314D':'#4A4D52'}"/>`}).join('')}</svg>`}
  if(v.length<2)return '<div class="mce">Not enough data yet</div>';
  const mn=Math.min(...v),rg=(Math.max(...v)-mn)||1,P=v.map((y,i)=>[r1(4+i*(W-10)/(v.length-1)),r1(H-7-(y-mn)/rg*(H-14))]),[lx,ly]=P[P.length-1];
  return `<svg class="mc" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline class="${ANIM?'draw':''}" pathLength="1" fill="none" stroke="#E0314D" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round" points="${P.map(p=>p.join(',')).join(' ')}"/>
    <circle cx="${lx}" cy="${ly}" r="7" fill="rgba(200,30,58,.2)"/><circle cx="${lx}" cy="${ly}" r="3" fill="#E0314D"/></svg>`;
}
function progressHTML(){
  const cards=dashCards();
  return `<div class="sec"><h2>Progress</h2><button class="lnk" data-act="cardsEdit">Edit</button></div>
    <div class="chips" style="margin-bottom:10px">${[[30,'1m'],[90,'3m'],[180,'6m'],[365,'1y']].map(([d,l])=>`<button class="chip ${ui.dper===d?'on':''}" data-act="dper" data-k="${d}">${l}</button>`).join('')}</div>
    <div class="pgrid">${cards.map(c=>{const s=cardSeries(c),v=s.pts.map(p=>p.v),av=a=>a.reduce((n,x)=>n+x,0)/(a.length||1),h=Math.floor(v.length/2);
      const cur=s.bars?r1(av(v)):v[v.length-1],f=s.bars?av(v.slice(0,h)):v[0],pct=v.length>1&&f?((s.bars?av(v.slice(h)):cur)-f)/f*100:null;
      return `<button class="soft pc press" data-act="cardOpen" data-id="${c.id}"><div class="pch"><span class="ell">${esc(s.title)}</span><i>${s.chip}</i></div><div class="pcs">${s.sub}</div>
        <div class="pcv num">${cur==null?'–':nf2(cur)}<small>${s.unit}</small>${pct==null?'':`<em class="${pct>0?'up':''}">${pct>0?'+':pct<0?'−':''}${Math.abs(pct).toFixed(1)}%</em>`}</div>${miniChart(s)}</button>`}).join('')
      ||'<div class="soft s" style="grid-column:1/-1;margin:0;text-align:center;padding:22px">No cards. Tap Edit to add some.</div>'}</div>`;
}
const nf2=n=>n>=1000?nf(n):String(n);
function cardsSheetHTML(s,na){
  const cards=ownCards(),has=k=>cards.some(c=>c.kind===k),logged=recordsOf(finished()).filter(r=>r.x.kind!=='cardio').sort((a,b)=>a.x.name.localeCompare(b.x.name));
  return `<div class="panel full ${na}"><div class="phead"><h2>Progress cards</h2><button class="cbtn" data-act="closeSheet" aria-label="Close">${IC.x}</button></div>
    <div class="pbody" style="padding-top:4px"><div class="label">On your dashboard · drag to reorder</div>
      <div class="stack" id="cdList">${cards.map(c=>{const t=cardSeries(c);return `<div class="soft rowc" data-row data-id="${c.id}" style="padding:8px 10px 8px 2px"><button class="handle" data-drag="cards" aria-label="Reorder">${IC.grip}</button>
        <div class="grow"><div class="ell">${esc(t.title)}</div><div class="s" style="margin:0">${t.sub}</div></div><button class="x" data-act="cardDel" data-id="${c.id}" aria-label="Remove card">${IC.x}</button></div>`}).join('')||'<div class="s" style="margin:0 4px">No cards yet.</div>'}</div>
      <div class="label">Add a card</div>
      <div class="grid2"><button class="btn" data-act="cardAdd" data-kind="bw" ${has('bw')?'disabled':''}>Bodyweight</button><button class="btn" data-act="cardAdd" data-kind="cardio" ${has('cardio')?'disabled':''}>Cardio distance</button></div>
      <div style="height:14px"></div>
      <div class="seg"><button class="${s.kind==='rm'?'on':''}" data-act="cardKind" data-k="rm">Est. 1RM</button><button class="${s.kind==='vol'?'on':''}" data-act="cardKind" data-k="vol">Volume</button></div>
      ${logged.map(r=>{const on=cards.some(c=>c.kind===s.kind&&c.exId===r.x.id);return `<div class="ex ${on?'sel':''}" data-act="cardAdd" data-kind="${s.kind}" data-ex="${r.x.id}"><div class="grow"><div class="nm ell">${esc(r.x.name)}</div><div class="s">${r.x.group} · ${r.n} session${r.n===1?'':'s'}</div></div><span class="box">${IC.check}</span></div>`}).join('')
        ||'<div class="empty" style="padding:26px 10px">Log a workout first, then pick exercises to chart here.</div>'}
    </div></div>`;
}
function exdSheetHTML(s,na){
  const x=exById(s.exId),cut=Date.now()-ui.dper*DAY,u=db.settings.unit,rec=recordsOf(finished()).find(r=>r.x.id===s.exId);
  const ses=finished().filter(w=>w.exercises.some(e=>e.exerciseId===s.exId)).slice(0,8);
  return `<div class="panel full ${na}"><div class="phead"><h2 class="ell">${esc(x?.name||'Exercise')}</h2><button class="cbtn" data-act="closeSheet" aria-label="Close">${IC.x}</button></div>
    <div class="pbody" style="padding-top:4px"><div class="chips" style="margin:0 -20px 10px;padding:0 20px">${[[30,'1m'],[90,'3m'],[180,'6m'],[365,'1y']].map(([d,l])=>`<button class="chip ${ui.dper===d?'on':''}" data-act="dper" data-k="${d}">${l}</button>`).join('')}</div>
      <div class="soft"><div class="tip" id="tip-x1"><span>Estimated 1RM · ${u}</span></div>${chartHTML('x1',exSeries(s.exId,'rm',cut),null,u,150)}</div>
      <div style="height:10px"></div>
      <div class="soft"><div class="tip" id="tip-x2"><span>Volume per session · ${u}</span></div>${chartHTML('x2',exSeries(s.exId,'vol',cut),null,u,150)}</div>
      ${rec?`<div class="label">Personal bests</div><div class="prg" style="margin:0">${['rm','w','reps','vol'].filter(k=>rec.rec[k]).map(k=>{const c=rec.rec[k];return `<button class="prt press" data-act="sessOpen" data-id="${c.id}"><span>${c.label}</span><b class="num">${c.txt}</b><em>${dfmt(c.t,{day:'numeric',month:'short',year:'numeric'})}</em></button>`}).join('')}</div>`:''}
      <div class="label">Recent sessions</div>
      ${ses.length?`<div class="soft"><div class="cmp">${ses.map(w=>{const sets=w.exercises.filter(e=>e.exerciseId===s.exId).flatMap(e=>e.sets.filter(q=>q.done&&q.type!=='warmup'));
        return `<button class="ln" style="width:100%" data-act="sessOpen" data-id="${w.id}"><span>${dfmt(w.startedAt,{day:'numeric',month:'short'})}</span><b class="num ell" style="min-width:0">${sets.map(q=>(q.weightKg?r2(dispW(q.weightKg)):'BW')+'×'+q.reps).join('  ')}</b></button>`}).join('')}</div></div>`:'<div class="s" style="margin:0 4px">No sessions yet.</div>'}
    </div></div>`;
}

/* ================= BACKUP / EXPORT ================= */
function download(name,text,type){
  const blob=new Blob([text],{type});
  try{if(/iPhone|iPad|iPod|Android/.test(navigator.userAgent)&&navigator.canShare){const f=new File([blob],name,{type});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}catch(e){toast('Export is not available here')}
}
const stamp=()=>localISO(Date.now()).slice(0,10);
function csvText(){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['date','time','workout','deload','exercise','muscle_group','set','type','weight_kg','reps','distance_m','duration_s','incline_pct','level','est_1rm_kg','pr']];
  for(const w of finished().reverse())for(const e of w.exercises){const x=exById(e.exerciseId);e.sets.filter(s=>s.done).forEach((s,i)=>rows.push([localISO(w.startedAt).slice(0,10),tfmt(w.startedAt),w.name,w.isDeload?1:0,x?.name||'Deleted exercise',x?.group||'',i+1,s.type,
    s.weightKg==null?'':r2(s.weightKg),s.reps??'',s.distanceM??'',s.durationSec??'',s.inclinePct??'',s.level??'',e1rm(s)?r1(e1rm(s)):'',s.pr?1:0]))}
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function importText(t){
  let o;try{o=JSON.parse(t)}catch(e){return toast('That file is not a valid backup')}
  const d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.exercises)||!Array.isArray(d.workouts))return toast('That file is not a Ghost backup');
  confirmSheet('Restore backup',`This replaces everything on this device with the backup: ${d.workouts.length} sessions, ${(d.routines||[]).length} routines, ${(d.bodyweights||[]).length} weigh-ins.`,'Restore',()=>{
    db=migrate(d);db.rest=null;ui.woOpen=false;ui.f=null;ui.sum=null;ui.editId=null;ui.stack=[];Store.flush();ui.lastKey='';render();renderWO();toast('Backup restored')},false);
}
Object.assign(A,{
  dper(d){ui.dper=+d.k;ANIM=true;render();if(ui.sheet&&ui.sheet.type==='exd'){ANIM=true;renderSheet(true);ANIM=false}},
  cardsEdit(){ui.sheet={type:'cards',kind:'rm'};renderSheet()},
  cardKind(d){ui.sheet.kind=d.k;renderSheet(true)},
  cardAdd(d){const cs=ownCards(),i=cs.findIndex(c=>c.kind===d.kind&&(c.exId||'')===(d.ex||''));
    if(i>=0)cs.splice(i,1);else cs.push({id:uid(),kind:d.kind,...(d.ex?{exId:d.ex}:{})});
    const sc=$('.pbody').scrollTop;save();render();renderSheet(true);$('.pbody').scrollTop=sc},
  cardDel(d){ownCards();db.cards=db.cards.filter(c=>c.id!==d.id);save();render();renderSheet(true)},
  cardOpen(d){const c=dashCards().find(x=>x.id===d.id);if(!c)return;
    if(c.kind==='bw'){ui.tab='body';ui.bseg='weight';render()}
    else if(c.kind==='cardio'){ui.tab='history';ui.hseg='pr';ui.prG='Cardio';render()}
    else{ui.sheet={type:'exd',exId:c.exId};ANIM=true;renderSheet();ANIM=false}},
  exdOpen(d){ui.sheet={type:'exd',exId:d.id};ANIM=true;renderSheet();ANIM=false},
  expJSON(){db.settings.lastBackup=Date.now();Store.flush();download(`ghost-backup-${stamp()}.json`,JSON.stringify({app:'ghost',v:1,exportedAt:new Date().toISOString(),data:db}),'application/json');render()},
  expCSV(){if(!finished().length)return toast('No sessions to export');download(`ghost-sets-${stamp()}.csv`,csvText(),'text/csv')},
});
document.addEventListener('change',e=>{if(e.target.id!=='impFile')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f);e.target.value=''});
const _so=A.sessOpen;A.sessOpen=d=>{if(ui.sheet)closeSheet();_so(d)};

/* ================= BOOT ================= */
(async()=>{
  await Store.open();
  const d=await Store.load();
  if(d)db=migrate(d);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();renderWO();
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
